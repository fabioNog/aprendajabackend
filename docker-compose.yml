version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: professor-db
    environment:
      POSTGRES_USER: professor
      POSTGRES_PASSWORD: professor123
      POSTGRES_DB: professor_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U professor"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Opcional: PGAdmin para administração visual
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: professor-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@professor.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_data: